name: Build and Publish Dev Container

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - '.versions'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: npmanos/devcontainer_wpilib

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Version Config
        id: load_env
        run: |
          # Read .versions file and append to $GITHUB_ENV
          if [ -f .versions ]; then
            cat .versions >> $GITHUB_ENV
            cat .versions # Print to console for debugging
          else
            echo "Error: .versions file not found!"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag with WPILib version, WPILib Year, and Latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VSCODE_WPILIB_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WPILIB_YEAR }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass all variables from .versions as build arguments
          build-args: |
            WPILIB_YEAR=${{ env.WPILIB_YEAR }}
            GCC_VERSION=${{ env.GCC_VERSION }}
            TOOLCHAIN_VERSION=${{ env.TOOLCHAIN_VERSION }}
            TOOLCHAIN_FILE=${{ env.TOOLCHAIN_FILE }}
            VSCODE_WPILIB_VERSION=${{ env.VSCODE_WPILIB_VERSION }}
            JDK_TAG=${{ env.JDK_TAG }}
            JDK_TAG_CLEAN=${{ env.JDK_TAG_CLEAN }}
