name: Build and Publish Dev Container

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'versions/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: athenian-robotics/arc-devcontainer

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get versions from `./versions`
        id: get-versions
        run: echo "versions=$(ls versions | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
  build:
    name: Build v${{ matrix.version }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.get-versions.outputs.versions) }} # In the form of e.x. `[2026.2.1, 2027.0.0]`
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Version Config
        run: cat 'versions/${{matrix.version}}' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            TARGETARCH=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            WPILIB_YEAR=${{ env.WPILIB_YEAR }}
            WPILIB_VERSION=${{ env.WPILIB_VERSION }}
            JDK_TAG=${{ env.JDK_TAG }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [get-versions, build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.get-versions.outputs.versions) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and publish multi-arch package
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail

          IMAGE_MANIFESTS=()
          for f in /tmp/digests/*; do
            DIGEST=$(basename "$f")
            IMAGE_MANIFESTS+=("${IMAGE}@sha256:$DIGEST")
          done

          if [[ "${#IMAGE_MANIFESTS[@]}" -ne 2 ]]; then
            echo "Expected 2 platform digests (amd64 and arm64), found ${#IMAGE_MANIFESTS[@]}"
            exit 1
          fi
          
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE_MANIFESTS[@]}"
