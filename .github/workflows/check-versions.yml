name: Check for WPILib Updates

on:
  schedule:
    # Run every day at 03:47 UTC
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Version Update Script
        run: python scripts/update_versions.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code .versions || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Read new version for commit message
          NEW_VERSION=$(git diff --name-only)
          
          git add versions/${NEW_VERSION}
          git commit -m "chore: add WPILib $NEW_VERSION"
          git push
