name: Check for WPILib Updates

on:
  schedule:
    # Run every day at 03:47 UTC
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Version Update Script
        run: python scripts/update_versions.py

      - name: Commit and Push Changes
        run: |
          if [[ -z "$(git status --porcelain -- versions/)" ]]; then
            echo "No version changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- versions/
          git commit -m "chore: update WPILib version metadata"
          git push
